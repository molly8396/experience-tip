name: 自动发布已审核经验
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 approved issue 并更新经验库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_approved.py

      - name: 提交并推送（Pages 自动部署）
        run: |
          git config user.name "experience-tip-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "无新经验，跳过提交"
          else
            git commit -m "auto: 发布已审核经验 $(date +%Y%m%d-%H%M)"
            git push
          fi
